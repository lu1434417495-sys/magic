[preset.0]

name="Windows Desktop Smoke"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Keep production JSON packaged even if editor resource recognition changes.
; Godot 4.6 currently classifies JSON as resources, so non-production namespaces
; must also be excluded explicitly; the Windows export smoke enforces the allow-list.
include_filter="data/configs/json/*.json"
exclude_filter="data/configs/engine_assets/*.json,data/schemas/**/*.json,docs/**/*.json,tests/**/*.json,tools/**/*.json,tmp/*.json,tmp/**/*.json,tools/architecture/**/bin/**,tools/architecture/**/obj/**"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
codesign/enable=false
