name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GODOT_VERSION: 4.6.2-stable
  GODOT_BIN: /usr/local/bin/godot

jobs:
  validate:
    name: Build and Full Regression
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            unzip \
            libfontconfig1 \
            libgl1 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

          curl -L --fail --retry 3 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64" /opt/godot
          sudo chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          sudo ln -s "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64" "${GODOT_BIN}"

          "${GODOT_BIN}" --version

      - name: Build C# project
        run: dotnet build magic.csproj

      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail

          "${GODOT_BIN}" --headless --import --quit --path .

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail

          test_jobs="$(nproc)"
          if [[ -z "${test_jobs}" || "${test_jobs}" -lt 1 ]]; then
            test_jobs=1
          fi
          echo "Running full regression suite with ${test_jobs} parallel job(s)."

          python tests/run_regression_suite.py \
            --godot "${GODOT_BIN}" \
            --jobs "${test_jobs}" \
            --stop-on-failure \
            --finalizer-crash-retries 1 \
            --fail-on-output-error
