name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GODOT_VERSION: 4.6.2-stable
  GODOT_BIN: /usr/local/bin/godot

jobs:
  validate:
    name: Build and Headless Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            unzip \
            libfontconfig1 \
            libgl1 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

          curl -L --fail --retry 3 --output /tmp/godot.zip \
            "https://downloads.godotengine.org/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64" /opt/godot
          sudo chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          sudo ln -s "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64" "${GODOT_BIN}"

          "${GODOT_BIN}" --version

      - name: Build C# project
        run: dotnet build magic.csproj

      - name: Run headless regressions
        run: python tests/run_regression_suite.py --godot "${GODOT_BIN}"
