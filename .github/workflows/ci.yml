name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GODOT_VERSION: 4.6.2-stable
  GODOT_BIN: /usr/local/bin/godot

jobs:
  regressions:
    name: Regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Run architecture analyzer tests
        run: dotnet run --project tools/architecture/Magic.ArchitectureAnalyzers.Tests/Magic.ArchitectureAnalyzers.Tests.csproj

      - name: Test regression partitioning and coverage tooling
        run: python -m unittest discover -s tests/tooling -p 'test_run_*suite.py'

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            unzip \
            libfontconfig1 \
            libgl1 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

          curl -L --fail --retry 3 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64" /opt/godot
          sudo chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          sudo ln -s "/opt/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64" "${GODOT_BIN}"

          "${GODOT_BIN}" --version

      - name: Build C# project
        run: dotnet build magic.csproj

      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail

          "${GODOT_BIN}" --headless --import --quit --path .

      - name: Run full regression suite with production coverage
        shell: bash
        run: |
          set -euo pipefail

          cpu_count="$(nproc)"
          if [[ -z "${cpu_count}" || "${cpu_count}" -lt 1 ]]; then
            cpu_count=1
          fi
          test_jobs="$(( (cpu_count + 1) / 2 ))"
          echo "Detected ${cpu_count} logical CPU(s); running shard ${{ matrix.shard }} of 4 with ${test_jobs} parallel job(s)."

          python tests/run_coverage_suite.py \
            --jobs "${test_jobs}" \
            -- \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --test-timeout-seconds 180 \
            --fail-on-output-error \
            --lifecycle-correctness

      - name: Upload production coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-code-coverage-shard-${{ matrix.shard }}
          path: artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: ignore

  validate:
    name: Build and Headless Smoke
    needs: regressions
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every regression shard to pass
        env:
          SHARD_RESULT: ${{ needs.regressions.result }}
        run: test "${SHARD_RESULT}" = success

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: production-code-coverage-shard-*
          path: artifacts/shards

      - name: Merge and validate production coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_files=(artifacts/shards/*/coverage.cobertura.xml)
          test "${#coverage_files[@]}" -eq 4
          dotnet tool restore
          mkdir -p artifacts/coverage
          dotnet tool run dotnet-coverage merge "${coverage_files[@]}" \
            --output artifacts/coverage/coverage.cobertura.xml \
            --output-format cobertura
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("tests").resolve()))
          from run_coverage_suite import parse_coverage_summary
          parse_coverage_summary(Path("artifacts/coverage/coverage.cobertura.xml").resolve(), Path.cwd())
          PY

      - name: Upload production coverage
        uses: actions/upload-artifact@v7
        with:
          name: production-code-coverage
          path: artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error
